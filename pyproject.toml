[project]
name = "sentinelflow"
version = "0.1.0"
description = "Evidence-grounded payment incident investigation with MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.35,<2",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
